name: Get Flag

on: [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  get-flag:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: bd8f7958-4730-4b91-9ea4-c29fb0b099d6
          tenant-id: fdd066e1-ee37-49bc-b08f-d0e152119b04
          subscription-id: 08d1f707-6af0-442e-acbe-60b1aecd0b14

      - name: Download flag
        run: |
          az storage blob download \
            --account-name iamazurelab309691c6b \
            --container-name flag \
            --name flag.txt \
            --file flag.txt \
            --auth-mode login

      - name: Read flag
        run: cat flag.txt
